name: Athar
options:
  bundleIdPrefix: com.ibrahim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
  groupSortPosition: top
  # خط «ثمانية» المموَّه (Resources/Fonts/Obf/*.bin) يُنسخ إلى حزمة التطبيق كمورد
  # لا يُترجَم؛ يفكّه FontLoader في الذاكرة عند الإقلاع.
  fileTypes:
    bin:
      buildPhase: resources

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: GV9S3Z8V4G
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Athar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Athar
        excludes:
          - "Resources/Info.plist"
          - "Athar.entitlements"
      - path: Shared
    dependencies:
      - target: AtharWidget
        embed: true
      # تطبيق الساعة يُضمَّن في التطبيق (Embed Watch Content).
      - target: AtharWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar
        PRODUCT_NAME: Athar
        INFOPLIST_FILE: Athar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Athar/Athar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # الأيقونات البديلة تُدرج بأسمائها هنا: بلا هذا لا يُنشئ المترجم لها ملفاتٍ في الحزمة،
        # فيرفض النظام setAlternateIconName بحجّة أنه لا يجدها.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-night AppIcon-sand AppIcon-sea AppIcon-rose AppIcon-indigo AppIcon-charcoal AppIcon-plum AppIcon-olive AppIcon-mint AppIcon-honey AppIcon-violet"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  AtharTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtharTests
    dependencies:
      - target: Athar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Athar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Athar"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # تطبيق Apple Watch: المواقيت والمسبحة. يشارك التطبيقَ ملفات Shared الخفيفة فقط
  # (لا محرّكات الصوت ولا ملفات البيانات الكبيرة).
  AtharWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AtharWatch
        excludes:
          - "Info.plist"
          - "AtharWatch.entitlements"
      - path: Shared
        excludes:
          - "Recitation.swift"
          - "AyahAudio.swift"
          - "LiveStreams.swift"
          - "RadioPlayer.swift"
          - "CloudKV.swift"
          - "CloudSync.swift"
          - "GroupKhatmah.swift"
          # الأذكار القصيرة فقط تلزم الساعة؛ المصحف والحديث والتفسير ثقيلة عليها.
          - "quran.json"
          - "quran_meta.json"
          - "hadith.json"
          - "ahkam.json"
          - "names.json"
          - "hajj.json"
          - "sharh40.json"
          - "Resources/**"
      # خطّ النسخ للأذكار والمسبحة على الساعة. مجموعة لا مرجع مجلّد حتى يعمل الاستثناء:
      # خط «ثمانية» المموَّه للتطبيق وحده — الساعة لا تسجّله ولا تحمله.
      - path: Athar/Resources/Fonts
        buildPhase: resources
        excludes:
          - "Obf/**"
    dependencies:
      - target: AtharWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar.watchkitapp
        PRODUCT_NAME: AtharWatch
        INFOPLIST_FILE: AtharWatch/Info.plist
        # أيقونة الساعة: بدونها يرفض App Store Connect الرفع (CFBundleIconName مفقود).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: AtharWatch/AtharWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  AtharWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AtharWatchWidget
        excludes:
          - "Info.plist"
          - "AtharWatchWidget.entitlements"
      - path: Shared
        excludes:
          - "Recitation.swift"
          - "AyahAudio.swift"
          - "LiveStreams.swift"
          - "RadioPlayer.swift"
          - "CloudKV.swift"
          - "CloudSync.swift"
          - "GroupKhatmah.swift"
          - "*.json"
          - "Resources/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar.watchkitapp.widget
        PRODUCT_NAME: AtharWatchWidget
        INFOPLIST_FILE: AtharWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtharWatchWidget/AtharWatchWidget.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  AtharWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtharWidget
        excludes:
          - "Info.plist"
          - "AtharWidget.entitlements"
      - path: Shared
        excludes:
          - ahkam.json
          # محرّكا التلاوة للتطبيق وحده — لا داعي لحملهما في الودجة.
          - "Recitation.swift"
          - "AyahAudio.swift"
          - "LiveStreams.swift"
          - "RadioPlayer.swift"
          - "GroupKhatmah.swift"
      # النسخ في حزمة الودجة كما في حزمة الساعة: الودجات تكتب الحديث والذكر واسم اليوم
      # بـ.custom("NotoNaskhArabic-…")، وبلا الملفات كانت تسقط صامتةً إلى خط النظام.
      # «ثمانية» (Obf) للتطبيق وحده — الودجات لا تسجّله ولا تستعمله.
      - path: Athar/Resources/Fonts
        buildPhase: resources
        excludes:
          - "Obf/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar.widget
        PRODUCT_NAME: AtharWidget
        INFOPLIST_FILE: AtharWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtharWidget/AtharWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  AtharWatch:
    build:
      targets:
        AtharWatch: all
  Athar:
    build:
      targets:
        Athar: all
        AtharWidget: all
        AtharTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtharTests
    archive:
      config: Release
