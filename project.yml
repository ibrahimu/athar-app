name: Athar
options:
  bundleIdPrefix: com.ibrahim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: GV9S3Z8V4G
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Athar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Athar
        excludes:
          - "Resources/Info.plist"
          - "Athar.entitlements"
      - path: Shared
    dependencies:
      - target: AtharWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar
        PRODUCT_NAME: Athar
        INFOPLIST_FILE: Athar/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Athar/Athar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  # AtharWatch (تطبيق Apple Watch) — الكود جاهز في AtharWatch/، لكنه معطّل هنا
  # لأن watchOS SDK غير مُثبَّت على جهاز البناء (يمنع الأرشفة). لتفعيله:
  # ثبّت watchOS في Xcode ← Settings ← Components، ثم أعِد إدراج الهدف والـ embed.
  AtharWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtharWidget
        excludes:
          - "Info.plist"
          - "AtharWidget.entitlements"
      - path: Shared
        excludes:
          # محرّك التلاوة للتطبيق وحده — لا داعي لحمله في الودجة.
          - "Recitation.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrahim.athar.widget
        PRODUCT_NAME: AtharWidget
        INFOPLIST_FILE: AtharWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtharWidget/AtharWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
